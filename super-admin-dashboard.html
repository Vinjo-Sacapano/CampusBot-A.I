<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Console — CampusBot AI — Aklan Catholic College</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- FontAwesome for UI Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Core Stylesheet (ACC Formal Collegiate Theme) -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Instant Theme Loader (Zero Glitch / Flash-Free) -->
  <script src="js/theme.js"></script>

  <!-- Third-party Client Libraries (Compat builds: works in file:/// and http) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body data-page="super-admin-dashboard">

<div class="app">

  <!-- Top Institutional Navigation (Distinct Super Admin Header) -->
  <header class="nav">
    <div class="brand">
      <div class="brand-mark">
        <i class="fa-solid fa-crown"></i>
      </div>
      <div class="brand-text">
        <h1>CampusBot AI</h1>
        <p id="schoolNameLabel">Aklan Catholic College</p>
      </div>
    </div>
    <div class="nav-actions">
      <button type="button" class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle dark/light mode" title="Toggle theme">
        <i class="fa-solid fa-moon"></i>
        <span class="theme-btn-label">Theme</span>
      </button>
      <span class="super-badge">
        <i class="fa-solid fa-shield-halved"></i> Super Admin Console
      </span>
    </div>
  </header>

  <!-- ======================================================================
       SUPER ADMIN COMMAND DASHBOARD CONTENT
       ====================================================================== -->
  <main id="adminView">

    <!-- Executive Stat Cards (Unique to Super Admin) -->
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-card-icon"><i class="fa-solid fa-users"></i></div>
        <div class="stat-card-info">
          <h4>Total Users</h4>
          <div class="stat-num" id="statTotalUsers">&mdash;</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon"><i class="fa-solid fa-user-graduate"></i></div>
        <div class="stat-card-info">
          <h4>Students</h4>
          <div class="stat-num" id="statTotalStudents">&mdash;</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon"><i class="fa-solid fa-user-tie"></i></div>
        <div class="stat-card-info">
          <h4>Staff & Admins</h4>
          <div class="stat-num" id="statTotalStaff">&mdash;</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon"><i class="fa-solid fa-database"></i></div>
        <div class="stat-card-info">
          <h4>Knowledge Entries</h4>
          <div class="stat-num" id="statTotalContent">&mdash;</div>
        </div>
      </div>
    </div>

    <!-- Super Admin Session Bar -->
    <div class="session-bar">
      <div class="who">
        <i class="fa-solid fa-crown" style="color:var(--brass);margin-right:6px;"></i>
        Executive Console <span id="adminWhoName"></span>
      </div>
      <button type="button" class="logout-btn" onclick="logoutAdmin()">
        <i class="fa-solid fa-arrow-right-from-bracket" style="margin-right:5px;"></i>Log out
      </button>
    </div>

    <!-- Accordion Navigation & Interactive Content Panel -->
    <div class="admin-wrap">
      <nav class="panel admin-nav" id="adminNav" aria-label="Admin Navigation Tabs"></nav>
      <section class="panel admin-content" id="adminContent" aria-label="Admin Management Panel"></section>
    </div>

  </main>

</div>

<!-- Persistent Save Toast -->
<div class="save-toast" id="saveToast">Saved successfully</div>

<!-- ======================================================================
     MODALS
     ====================================================================== -->

<!-- Terms & Privacy Modal -->
<div class="modal-overlay" id="infoModalOverlay" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="infoModalTitle">Terms & Policy</h3>
      <button type="button" class="modal-close" onclick="closeInfoModal()" aria-label="Close modal">&times;</button>
    </div>
    <div id="infoModalBody"></div>
  </div>
</div>

<!-- ======================================================================
     SCRIPTS
     ====================================================================== -->
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>

<script>
/* ============================================================================
   SUPER ADMIN COMMAND CENTER ORCHESTRATION
   ============================================================================ */

async function initSuperAdminDashboard() {
  if (typeof window.loadData !== 'function') {
    document.body.insertAdjacentHTML('afterbegin', '<div role="alert" style="background:#A32A18;color:#fff;padding:12px 16px;font:600 14px sans-serif;">CampusBot could not load js/firebase-config.js. Keep super-admin-dashboard.html next to the css/ and js/ folders.</div>');
    return;
  }

  // 1. Load school knowledge base from Firestore / local cache
  await window.loadData();

  // 2. Set School Name label
  const nameLabel = document.getElementById('schoolNameLabel');
  if (nameLabel && window.DATA && window.DATA.school) {
    nameLabel.textContent = window.DATA.school.name + " \u2014 Executive Console";
  }

  // 3. Render Admin Tabs with User Management as priority
  renderAdminNav();
  switchAdminTab('users');

  // 4. Update Metric Stat Cards
  if (typeof window.renderSuperAdminStats === 'function') {
    await window.renderSuperAdminStats();
  }

  // 5. Restore active session (guard against unauthenticated or non-superadmin access)
  if (typeof window.initAuthSessions === 'function') {
    window.initAuthSessions();
  }
}

// Initialize on DOM load
window.addEventListener('DOMContentLoaded', initSuperAdminDashboard);
</script>

</body>
</html>
